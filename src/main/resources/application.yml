spring:
  application:
    name: order-placement-with-events

  datasource:
    url: ${DB_URL:jdbc:h2:mem:orderplacement;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  h2:
    console:
      enabled: false

  task:
    execution:
      thread-name-prefix: events-async-
      pool:
        core-size: ${ASYNC_POOL_CORE_SIZE:4}
        max-size: ${ASYNC_POOL_MAX_SIZE:8}
        queue-capacity: ${ASYNC_POOL_QUEUE_CAPACITY:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
