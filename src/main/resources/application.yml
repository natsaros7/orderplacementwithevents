spring:
  application:
    name: order-placement-with-events

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderplacement}
    username: ${DB_USER:orderplacement}
    password: ${DB_PASSWORD:orderplacement}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  task:
    execution:
      thread-name-prefix: events-async-
      pool:
        core-size: ${ASYNC_POOL_CORE_SIZE:4}
        max-size: ${ASYNC_POOL_MAX_SIZE:8}
        queue-capacity: ${ASYNC_POOL_QUEUE_CAPACITY:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
