<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Place an order</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main>
    <h1>Place an order</h1>
    <form th:action="@{/orders}" th:object="${command}" method="post" novalidate>
        <label for="productCode">Product code</label>
        <input type="text" id="productCode" th:field="*{productCode}" autocomplete="off">
        <span class="error" th:if="${#fields.hasErrors('productCode')}" th:errors="*{productCode}"></span>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" th:field="*{quantity}" min="1">
        <span class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>

        <button type="submit">Place order</button>
    </form>
</main>
</body>
</html>
